<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{style.css}" />
</head>
<body>

<div th:replace="~{layout :: layout(~{::title}, ~{::section})}">
      <!-- Main Content Fragment -->
    <th:block th:fragment="section">
    <h1>Student Registration</h1>
    <p th:if="${message}" th:text="${message}"></p>
    <form th:action="@{/student-registration}" th:object="${student}" method="post">
        <label>Student Name:</label>
        <input type="text" th:field="*{name}" placeholder="Enter student name" required/>
        <br/>
        <label>Student Age:</label>
        <input type="number" th:field="*{age}" placeholder="Enter student age" required/>
        <br/>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button> 
    </form>
    </th:block>
    </div>
</body>
</html>
