<!-- templates/students.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
</head>
<body>

<!-- Render this using the layout -->
<div th:replace="layout :: layout(~{::title}, ~{::section})">

    <!-- Page title (can be used in layout if needed) -->
    <th:block th:fragment="title">
        <title>List of Students</title>
    </th:block>

    <!-- Main content fragment -->
    <th:block th:fragment="section">
        <h1>Student List</h1>
        <table border="1">
            <thead>
                <tr>
                    <th>ID</th><th>First Name</th><th>Last Name</th><th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.age}"></td>
                    
                </tr>
            </tbody>
        </table>
    </th:block>

</div>

</body>
</html>
