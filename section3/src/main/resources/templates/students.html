<!-- src/main/resources/templates/students.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>
    <meta charset="UTF-8"/>
</head>
<body>
    <h1>Student List</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th><th>First Name</th><th>Last Name</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}">1</td>
                <td th:text="${student.name}">First</td>
                <td th:text="${student.age}">email@example.com</td>
            </tr>
        </tbody>
    </table>
    <p th:text="'Total Students: ' + ${#lists.size(students)}"></p>
    <p th:if="${#lists.isEmpty(students)}">No students found.</p>
</body>
</html>
