<div style="text-align: center;">Registering a new student</div>
<form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
    
  <div class="form-group">
    <label for="name">Name:</label>
    <input id="name" formControlName="name" class="form-control" />
    <div *ngIf="f['name'].invalid && f['name'].touched" class="text-danger">
      Name is required.
    </div>
  </div>
  <div class="form-group">
    <label for="age">Age:</label>
    <input id="age" type="number" formControlName="age" class="form-control" />
    <div *ngIf="f['age'].invalid && f['age'].touched" class="text-danger">
      Age must be a positive number.
    </div>
  </div>
  <button type="submit" class="btn btn-primary" [disabled]="studentForm.invalid || isSaving">
    {{ isSaving ? 'Saving...' : 'Create Student' }}
  </button>




   <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
</form>

<div style="text-align: center;">
    <a routerLink="/students">Back to Student List</a>
</div>
